name: Research integrity

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-integrity:
    name: audit state and verified-facts projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20

      - name: Temporary NIK-0001 source inspection
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pymupdf
          python - <<'PY'
          import base64
          import fitz

          pdf = 'Николаев Г.В. – Электродинамика физического вакуума – 2004.pdf'
          doc = fitz.open(pdf)
          print(f'=== PDFINFO pages={doc.page_count} ===')
          for p in range(17, 22):
              page = doc[p - 1]
              text = page.get_text('text')
              print(f'=== PDF_PAGE_{p}_TEXT_BEGIN ===')
              print('\n'.join(text.splitlines()[:100]))
              print(f'=== PDF_PAGE_{p}_TEXT_END ===')
          for p in range(17, 22):
              page = doc[p - 1]
              pix = page.get_pixmap(matrix=fitz.Matrix(1.15, 1.15), alpha=False)
              png = pix.tobytes('png')
              print(f'=== PDF_PAGE_{p}_PNG_BASE64_BEGIN ===')
              print(base64.b64encode(png).decode('ascii'))
              print(f'=== PDF_PAGE_{p}_PNG_BASE64_END ===')
          PY

      - name: Check research state
        run: node checks/audit-integrity.mjs

      - name: Check generated verified-facts document
        run: node scripts/generate-verified-facts.mjs --check

      - name: Check out exact repo-guard projection API
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: netkeep80/repo-guard
          ref: 38f8c681a9ac0a49a8c785b2dab5758d7ff79ad8
          path: .repo-guard-tool
          fetch-depth: 1

      - name: Install exact repo-guard runtime dependencies
        run: npm --prefix .repo-guard-tool install --omit=dev --silent

      - name: Verify repo-guard ProjectionModel identities
        run: node checks/verified-facts-projection.mjs --repo-guard-root .repo-guard-tool
