name: Research integrity

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-integrity:
    name: audit state and verified-facts projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20

      - name: Check research-model dependency contract
        run: node checks/research-model-contract-selftest.mjs

      - name: Temporary regenerate final NIK-0001 projection
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-verified-facts.mjs
          echo '=== VERIFIED_FACTS_MD_BASE64_BEGIN ==='
          base64 -w0 docs/generated/verified-facts.md
          echo
          echo '=== VERIFIED_FACTS_MD_BASE64_END ==='
          echo '=== VERIFIED_FACTS_BUILD_BASE64_BEGIN ==='
          base64 -w0 projections/verified-facts.build.json
          echo
          echo '=== VERIFIED_FACTS_BUILD_BASE64_END ==='

      - name: Check research state
        run: node checks/audit-integrity.mjs

      - name: Check generated verified-facts document
        run: node scripts/generate-verified-facts.mjs --check

      - name: Check out exact repo-guard projection API
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: netkeep80/repo-guard
          ref: 38f8c681a9ac0a49a8c785b2dab5758d7ff79ad8
          path: .repo-guard-tool
          fetch-depth: 1

      - name: Install exact repo-guard runtime dependencies
        run: npm --prefix .repo-guard-tool install --omit=dev --silent

      - name: Verify repo-guard ProjectionModel identities
        run: node checks/verified-facts-projection.mjs --repo-guard-root .repo-guard-tool
