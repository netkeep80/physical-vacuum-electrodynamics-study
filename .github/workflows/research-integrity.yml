name: Research integrity

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-integrity:
    name: audit state and verified-facts projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20

      - name: Temporary NIK-0001 source inspection
        shell: bash
        run: |
          set -euo pipefail
          pdf='Николаев Г.В. – Электродинамика физического вакуума – 2004.pdf'
          echo '=== PDFINFO ==='
          pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size):' || true
          for p in 15 16 17 18 19 20; do
            echo "=== PDF_PAGE_${p}_TEXT_BEGIN ==="
            pdftotext -f "$p" -l "$p" -layout "$pdf" - | head -n 80
            echo "=== PDF_PAGE_${p}_TEXT_END ==="
          done
          pdftoppm -f 17 -l 17 -singlefile -png -r 110 "$pdf" /tmp/nik-page-17 >/dev/null 2>&1
          echo '=== PDF_PAGE_17_PNG_BASE64_BEGIN ==='
          base64 -w0 /tmp/nik-page-17.png
          echo
          echo '=== PDF_PAGE_17_PNG_BASE64_END ==='

      - name: Check research state
        run: node checks/audit-integrity.mjs

      - name: Check generated verified-facts document
        run: node scripts/generate-verified-facts.mjs --check

      - name: Check out exact repo-guard projection API
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: netkeep80/repo-guard
          ref: 38f8c681a9ac0a49a8c785b2dab5758d7ff79ad8
          path: .repo-guard-tool
          fetch-depth: 1

      - name: Install exact repo-guard runtime dependencies
        run: npm --prefix .repo-guard-tool install --omit=dev --silent

      - name: Verify repo-guard ProjectionModel identities
        run: node checks/verified-facts-projection.mjs --repo-guard-root .repo-guard-tool
