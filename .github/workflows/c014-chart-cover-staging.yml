# Временная веточная сборка детерминированных русских проекций; удалить до слияния.
name: C014 конечное покрытие — сборка проекций
on:
  push:
    branches:
      - proof/c014-finite-chart-cover-bridge
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/proof/c014-finite-chart-cover-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12'
      - name: Установить закреплённые средства PDF
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core poppler-utils
      - name: Детерминированная генерация и проверка научных проекций
        run: |
          node scripts/generate-verified-facts.mjs
          python scripts/generate-audit-report.py --write
          python scripts/generate-audit-report.py --check
          node scripts/generate-verified-facts.mjs --check
      - name: Зафиксировать только канонические генерируемые артефакты
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/generated/verified-facts.md projections/verified-facts.build.json docs/generated/audit-report.pdf projections/audit-report.build.json
          if git diff --cached --quiet; then
            echo 'C014_CHART_COVER_PROJECTIONS_CURRENT'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: regenerate Russian C014 finite-chart-cover audit'
          git push origin 'HEAD:refs/heads/proof/c014-finite-chart-cover-bridge'
