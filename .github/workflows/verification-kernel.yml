name: Verification kernel

on:
  pull_request:
    branches: ["**"]
    paths:
      - "formal/**"
      - "compute/**"
      - ".github/workflows/verification-kernel.yml"
  push:
    branches: ["main"]
    paths:
      - "formal/**"
      - "compute/**"
      - ".github/workflows/verification-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean + Physlib proof kernel
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build pinned Lean project
        uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
        with:
          lake-package-directory: formal
          build: "true"
          test: "false"
          lint: "false"
          axiom-audit: "true"
          axiom-audit-root: PVE

  julia:
    name: Julia computational workbench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up exact Julia
        uses: julia-actions/setup-julia@ea6d69adb9096626f5a102ce966e8ed7fb5f5b9d
        with:
          version: "1.13.1"
          show-versioninfo: "true"
      - name: Run deterministic smoke
        run: julia --project=compute compute/smoke.jl
      - name: Run NIK-0007 computational checks
        run: julia --project=compute compute/nik0007.jl

  typescript:
    name: TypeScript numerical regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
      - name: Compile pinned TypeScript
        run: npx --yes --package typescript@5.9.3 tsc -p compute/ts/tsconfig.json
      - name: Run deterministic numeric regression smoke
        run: node compute/ts/dist/smoke.js
      - name: Run NIK-0007 numerical regression
        run: node compute/ts/dist/nik0007.js
