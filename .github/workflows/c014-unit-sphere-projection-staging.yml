# Temporary branch-scoped deterministic projection publisher, removed before merge.
name: C014 unit sphere mass projection staging
on:
  push:
    branches:
      - research/nik-0008-c014-sphere-unit-mass
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/research/nik-0008-c014-sphere-unit-mass'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12'
      - name: Install pinned Russian PDF runtime
        run: |
          python -m pip install --disable-pip-version-check reportlab==4.4.9
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core poppler-utils
      - name: Regenerate all canonical projections with bytewise checks
        run: |
          node scripts/generate-verified-facts.mjs
          python scripts/generate-audit-report.py --write
          python scripts/generate-audit-report.py --check
          node scripts/generate-verified-facts.mjs --check
      - name: Commit deterministic projection outputs on current branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/generated/verified-facts.md projections/verified-facts.build.json docs/generated/audit-report.pdf projections/audit-report.build.json
          if git diff --cached --quiet; then
            echo 'C014_UNIT_SPHERE_PROJECTIONS_CURRENT'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: regenerate deterministic C014 unit-sphere-mass Russian audit'
          git push origin 'HEAD:refs/heads/research/nik-0008-c014-sphere-unit-mass'
